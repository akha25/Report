# One-click deploy on Render (render.com): New + > Blueprint > pick this repo.
# Use a paid instance (Starter or above): free instances sleep, and a sleeping app can't run the 2/5/7/9 PM schedule.
services:
  - type: web
    name: setter-closer-reports
    runtime: docker
    plan: starter
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: setter-closer-reports-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: SECURE_COOKIES
        value: "true"
      - key: ADMIN_PASSWORD
        sync: false
      - key: VIEWER_PASSWORD
        sync: false
      - key: HUBSPOT_TOKEN
        sync: false
      - key: SLACK_WEBHOOK_URL
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false

databases:
  - name: setter-closer-reports-db
    plan: basic-256mb
