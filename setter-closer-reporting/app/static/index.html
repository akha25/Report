<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daily Setter &amp; Closer Performance Report</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div id="login" class="login hidden">
    <form id="loginForm" class="login-card">
      <h1>Daily Setter &amp; Closer<br>Performance Report</h1>
      <p class="muted">Sign in to view and manage the reports.</p>
      <label>Your name<input name="name" autocomplete="name" placeholder="e.g. Somesh"></label>
      <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
      <button class="btn primary" type="submit">Sign in</button>
      <p id="loginError" class="error-text"></p>
    </form>
  </div>

  <div id="shell" class="shell hidden">
    <aside class="sidebar">
      <div class="brand">Sales Ops<br><span>Performance Reports</span></div>
      <nav id="nav">
        <a href="#/" data-route="report">Report</a>
        <a href="#/history" data-route="history">History</a>
        <a href="#/compare" data-route="compare">Compare</a>
        <a href="#/trend" data-route="trend">Through the day</a>
        <a href="#/uploads" data-route="uploads">FreJun uploads</a>
        <a href="#/roster" data-route="roster">Roster</a>
        <a href="#/logs" data-route="logs">Activity log</a>
        <a href="#/settings" data-route="settings">Status &amp; setup</a>
      </nav>
      <div class="whoami"><span id="whoName"></span><button id="logoutBtn" class="link">Sign out</button></div>
    </aside>
    <main id="view" class="view"></main>
  </div>
  <div id="toast" class="toast hidden"></div>
  <script src="/static/app.js"></script>
</body>
</html>
