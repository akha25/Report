services:
  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://reports:reports@db:5432/reports
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: reports
      POSTGRES_PASSWORD: reports
      POSTGRES_DB: reports
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reports"]
      interval: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
